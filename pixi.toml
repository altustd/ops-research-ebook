[workspace]
authors = ["Troy Altus <altustd@gmail.com>"]
channels = ["conda-forge"]
name = "ops-research"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]
setup   = "python -m ipykernel install --user --name orml --display-name 'Python (orml)'"
render  = "bash render.sh"
preview = "bash render.sh --preview"

[dependencies]
python      = ">=3.12,<3.13"
numpy       = ">=2.4,<3"
scipy       = ">=1.17,<2"
matplotlib  = ">=3.10,<4"
plotly      = ">=6,<7"
scikit-learn = ">=1.8,<2"
networkx    = ">=3.6,<4"
pandas      = ">=2.2,<3"
joblib      = ">=1.4,<2"
pandera     = ">=0.20,<1"
ipykernel   = ">=6,<7"
notebook    = ">=7,<8"
pyyaml      = ">=6,<7"
jupyter     = ">=1,<2"

[pypi-dependencies]
pulp = ">=3.3,<4"
