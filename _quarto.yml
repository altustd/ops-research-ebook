project:
  type: book
  output-dir: docs

book:
  title: "Data Science Tools for Classical Operations Research"
  subtitle: "Python Implementation of Numerical Optimization & Modern OR"
  author: "Troy Altus"
  date: "May 2026"
  search: true
  downloads: [pdf, epub]
  sharing: [twitter, linkedin]

  chapters:
    - index.qmd
    - part: "Part I: Foundations"
      chapters:
        - chapters/01-foundations-linear-algebra.qmd
        - chapters/02-foundations-probability-statistics.qmd
        - chapters/03-foundations-modeling.qmd
    - part: "Part II: Classical Optimization"
      chapters:
        - chapters/04-introduction-to-or-ml.qmd
        - chapters/05-linear-programming.qmd
        - chapters/06-integer-programming.qmd
        - chapters/07-network-optimization.qmd
    - part: "Part III: Uncertainty and Data-Driven Approaches"
      chapters:
        - chapters/08-stochastic-programming.qmd
        - chapters/09-robust-optimization.qmd
        - chapters/10-simulation-monte-carlo.qmd
    - part: "Part IV: Machine Learning Meets Optimization"
      chapters:
        - chapters/11-predict-then-optimize.qmd
        - chapters/12-reinforcement-learning-dp.qmd
        - chapters/13-learning-augmented-optimization.qmd
    - part: "Part V: Data Science Tooling for OR"
      chapters:
        - chapters/17-ds-pipeline-for-optimization.qmd
        - chapters/18-interactive-visualization.qmd
        - chapters/19-agent-augmented-workflows.qmd
    - part: "Part VI: Applications"
      chapters:
        - chapters/14-supply-chain-optimization.qmd
        - chapters/15-resource-scheduling.qmd
    - part: "Part VII: Capstone"
      chapters:
        - chapters/16-capstone-pipeline.qmd
    - references.qmd

bibliography: references.bib

format:
  html:
    theme: cosmo
    code-fold: true
    code-tools: true
    toc: true
    toc-depth: 3
    number-sections: true
    highlight-style: github
  pdf:
    documentclass: book
    number-sections: true
    toc: true
    colorlinks: true

execute:
  echo: true
  warning: false
  message: false